# Startet die PostgreSQL-Datenbank für die Entwicklung:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: girokonto-db
    environment:
      POSTGRES_DB: girokonto
      POSTGRES_USER: girokonto
      POSTGRES_PASSWORD: girokonto
    ports:
      - "5432:5432"
    volumes:
      - girokonto-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U girokonto -d girokonto"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  girokonto-data:
