name: girokonto_app
description: Smartphone-Girokonto mit Sparzielen (Projekt Informatik WiSe 26/27)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  # Gerätekontakte für das Adressbuch (/F220/), nur iOS/Android
  flutter_contacts: ^1.1.9
  # Live-Benachrichtigungen über WebSocket/STOMP (/F510/)
  stomp_dart_client: ^3.0.1
  # Systembenachrichtigungen auf iOS/Android (/F510/)
  flutter_local_notifications: ^17.2.2
  # QR-Code für die Zwei-Faktor-Einrichtung (/K050/)
  qr_flutter: ^4.1.0
  # Datei auswählen für den CSV-Import (/K040/), offizielles Paket des Flutter-Teams
  file_selector: ^1.0.3
  # Benachrichtigungen bei geschlossener App: Hintergrund-Abfrage auf Android (/K070/)
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Ende-zu-Ende-Tests auf echtem Gerät/Emulator/Browser (integration_test/)
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Schrift in der App mitliefern: die Web-App braucht so kein Google-CDN (z. B. Präsentation ohne Internet)
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
