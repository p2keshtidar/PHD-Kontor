name: girokonto_app
description: Smartphone-Girokonto mit Sparzielen (Projekt Informatik WiSe 26/27)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  # Gerätekontakte für das Adressbuch (/F220/), nur iOS/Android
  flutter_contacts: ^1.1.9
  # Live-Benachrichtigungen über WebSocket/STOMP (/F510/)
  stomp_dart_client: ^2.0.0
  # Systembenachrichtigungen auf iOS/Android (/F510/)
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Ende-zu-Ende-Tests auf echtem Gerät/Emulator/Browser (integration_test/)
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
