spring:
  application:
    name: girokonto
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/girokonto}
    username: ${DB_USER:girokonto}
    password: ${DB_PASSWORD:girokonto}
  jpa:
    # Das Schema wird ausschließlich über Flyway-Migrationen (db/migration) verwaltet.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

app:
  # "production" verhindert den Start mit den Entwicklungs-Schlüsseln unten (SecretsGuard)
  environment: ${APP_ENV:development}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-per-minute: 30     # Anmelden/Registrieren je IP
    api-per-minute: 600     # übrige Aufrufe je Token
  jwt:
    # Nur für die Entwicklung! Im Betrieb über die Umgebungsvariable JWT_SECRET setzen (Base64, mind. 32 Byte).
    secret: ${JWT_SECRET:1ne2R3UORTd0dfO73zFIRmS24V7dyK6l18u2fM8IyCPSbV4eztOqvRPT69Yo7u9z}
    access-token-minutes: 15
    refresh-token-days: 7
  bank:
    # Fiktive Bankleitzahl (beginnt mit 0, gehört daher garantiert keiner echten Bank). Offener Punkt O4.
    blz: "00010001"
    name: "Projektbank"
  start-balance-cents: 100000
  login:
    max-failed-attempts: 5
    lock-minutes: 5
  transfer:
    # Tageslimit für Überweisungen (/F230/): 5.000 €
    daily-limit-cents: 500000
    max-amount-cents: 500000
  card:
    # Schlüssel für die Verschlüsselung der Kartennummern (Base64, 32 Byte). Im Betrieb über CARD_KEY setzen.
    encryption-key: ${CARD_KEY:q3Jm0QbN8y4k9tXc2Vh7LpZr5Wd1Fs6Ge0Ua3Ti8Ko4=}
    bin: "999999"
    default-daily-limit-cents: 100000
    max-daily-limit-cents: 200000
  subaccounts:
    max-per-user: 50       # digitale Konten je Nutzer ("beliebig viele", mit Obergrenze gegen Missbrauch)
  admin:
    # Wird beim ersten Start angelegt; darf die Simulationszeit vorspulen (/F950/)
    email: ${ADMIN_EMAIL:admin@projektbank.de}
    password: ${ADMIN_PASSWORD:admin12345}
  simulation:
    zone: Europe/Berlin
  allocations:
    # Sparregeln für digitale Konten (Umbuchung vom Girokonto oder Vormerkung bei verbundenen Bankkonten)
    max-rules-per-user: 20
    max-attempts: 3              # 1. Versuch am Fälligkeitstag + 2 Wiederholungen an den Folgetagen
    balance-max-age-hours: 48    # so alt darf der Kontostand für eine Vormerkung höchstens sein
  banking:
    # Sandbox-Banken mit Testdaten (keine echte Bank). Im Betrieb mit echten Konten ggf. abschalten.
    sandbox-enabled: ${BANKING_SANDBOX:true}
    auto-sync: ${BANKING_AUTO_SYNC:true}
    sync-interval-minutes: 360        # alle 6 Stunden (PSD2: Banken erlauben oft nur 4 Abrufe pro Tag)
    retry-attempts: 3
    retry-backoff-ms: 500
    initial-history-days: 90
    # Rücksprung nach der Freigabe bei der Bank (öffentliche Adresse des Servers)
    redirect-url: ${BANKING_REDIRECT_URL:http://localhost:8080/api/banking/callback}
    gocardless:
      # Echte Bankverbindungen nur mit Vertrag und Zugangsdaten (nie im Code, nur als Umgebungsvariablen)
      base-url: ${GOCARDLESS_BASE_URL:https://bankaccountdata.gocardless.com/api/v2}
      secret-id: ${GOCARDLESS_SECRET_ID:}
      secret-key: ${GOCARDLESS_SECRET_KEY:}
  cors:
    allowed-origin-patterns:
      - "http://localhost:*"
      - "http://127.0.0.1:*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: girokonto

springdoc:
  swagger-ui:
    path: /swagger-ui.html
