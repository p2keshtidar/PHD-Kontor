# Prüft bei jedem Push: Backend-Tests, App-Tests und die Builds für alle drei Plattformen (/NF070/).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # nur für das Ablegen von Fehlerprotokollen (Branches ci-logs-*)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- Backend
  backend:
    name: Backend (Tests mit PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew
      - run: set -o pipefail; ./gradlew test --no-daemon 2>&1 | tee -a /tmp/ci.log
        shell: bash
      # Bei Fehlern das Ende des Protokolls als Annotation anzeigen (auch ohne Log-Download lesbar)
      - name: Fehlerprotokoll
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/ci.log ]; then
            # nur relevante Zeilen, in Stücken zu ca. 3.500 Zeichen (Grenze einer Annotation)
            grep -v "(created)" /tmp/ci.log | grep -iE "error|warning|fail|exception|expected|actual|•|\.dart:[0-9]+|what went wrong|caused by|requires|dependency|> " \
              | tail -c 30000 > /tmp/ci-short.log || true
            split -C 3500 /tmp/ci-short.log /tmp/ci-part-
            for f in /tmp/ci-part-*; do
              msg=$(sed -e 's/%/%25/g' -e 's/\r//g' "$f" | awk '{printf "%s%%0A", $0}')
              echo "::error title=Protokoll::$msg"
            done
          fi
      - name: Vollständiges Protokoll in Branch ablegen
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/logs && cp /tmp/ci.log /tmp/logs/ci.log 2>/dev/null || echo "kein Protokoll" > /tmp/logs/ci.log
          cd /tmp/logs && git init -q && git checkout -q -b logs && git add . \
            && git -c user.name=ci -c user.email=ci@example.org commit -qm "Protokoll ${{ github.run_id }} ${{ github.job }}" \
            && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" logs:ci-logs-${{ github.job }}
      - name: Testabdeckung
        if: always()
        run: python3 ../tool/coverage_summary.py jacoco build/reports/jacoco/test/jacocoTestReport.xml || true
      - name: Testbericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-testbericht
          path: |
            backend/build/reports/tests/test
            backend/build/reports/jacoco/test/html
          if-no-files-found: ignore

  # ---------------------------------------------------------------- App: Analyse + Tests + Web
  app:
    name: App (Analyse, Tests, Web-Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: set -o pipefail; flutter create . --platforms=android,ios,web --org de.frauas --project-name girokonto_app 2>&1 | tee -a /tmp/ci.log
        shell: bash
      - run: set -o pipefail; flutter pub get 2>&1 | tee -a /tmp/ci.log
        shell: bash
      - run: set -o pipefail; dart run tool/setup_platforms.dart 2>&1 | tee -a /tmp/ci.log
        shell: bash
      - run: set -o pipefail; flutter analyze --no-fatal-infos 2>&1 | tee -a /tmp/ci.log
        shell: bash
      - run: set -o pipefail; flutter test --coverage 2>&1 | tee -a /tmp/ci.log
        shell: bash
      - name: Testabdeckung
        run: python3 ../tool/coverage_summary.py lcov coverage/lcov.info || true
      - run: set -o pipefail; flutter build web --release --no-web-resources-cdn 2>&1 | tee -a /tmp/ci.log
        shell: bash
      # Bei Fehlern das Ende des Protokolls als Annotation anzeigen (auch ohne Log-Download lesbar)
      - name: Fehlerprotokoll
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/ci.log ]; then
            # nur relevante Zeilen, in Stücken zu ca. 3.500 Zeichen (Grenze einer Annotation)
            grep -v "(created)" /tmp/ci.log | grep -iE "error|warning|fail|exception|expected|actual|•|\.dart:[0-9]+|what went wrong|caused by|requires|dependency|> " \
              | tail -c 30000 > /tmp/ci-short.log || true
            split -C 3500 /tmp/ci-short.log /tmp/ci-part-
            for f in /tmp/ci-part-*; do
              msg=$(sed -e 's/%/%25/g' -e 's/\r//g' "$f" | awk '{printf "%s%%0A", $0}')
              echo "::error title=Protokoll::$msg"
            done
          fi
      - name: Vollständiges Protokoll in Branch ablegen
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/logs && cp /tmp/ci.log /tmp/logs/ci.log 2>/dev/null || echo "kein Protokoll" > /tmp/logs/ci.log
          cd /tmp/logs && git init -q && git checkout -q -b logs && git add . \
            && git -c user.name=ci -c user.email=ci@example.org commit -qm "Protokoll ${{ github.run_id }} ${{ github.job }}" \
            && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" logs:ci-logs-${{ github.job }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: app/build/web

  # ---------------------------------------------------------------- Android
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: set -o pipefail; flutter create . --platforms=android,ios,web --org de.frauas --project-name girokonto_app 2>&1 | tee -a /tmp/ci.log
        shell: bash
      - run: set -o pipefail; flutter pub get 2>&1 | tee -a /tmp/ci.log
        shell: bash
      - run: set -o pipefail; dart run tool/setup_platforms.dart 2>&1 | tee -a /tmp/ci.log
        shell: bash
      # Für den Android-Emulator zeigt 10.0.2.2 auf den eigenen PC
      - run: set -o pipefail; flutter build apk --debug --dart-define=API_URL=http://10.0.2.2:8080 2>&1 | tee -a /tmp/ci.log
        shell: bash
      # Bei Fehlern das Ende des Protokolls als Annotation anzeigen (auch ohne Log-Download lesbar)
      - name: Fehlerprotokoll
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/ci.log ]; then
            # nur relevante Zeilen, in Stücken zu ca. 3.500 Zeichen (Grenze einer Annotation)
            grep -v "(created)" /tmp/ci.log | grep -iE "error|warning|fail|exception|expected|actual|•|\.dart:[0-9]+|what went wrong|caused by|requires|dependency|> " \
              | tail -c 30000 > /tmp/ci-short.log || true
            split -C 3500 /tmp/ci-short.log /tmp/ci-part-
            for f in /tmp/ci-part-*; do
              msg=$(sed -e 's/%/%25/g' -e 's/\r//g' "$f" | awk '{printf "%s%%0A", $0}')
              echo "::error title=Protokoll::$msg"
            done
          fi
      - name: Vollständiges Protokoll in Branch ablegen
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/logs && cp /tmp/ci.log /tmp/logs/ci.log 2>/dev/null || echo "kein Protokoll" > /tmp/logs/ci.log
          cd /tmp/logs && git init -q && git checkout -q -b logs && git add . \
            && git -c user.name=ci -c user.email=ci@example.org commit -qm "Protokoll ${{ github.run_id }} ${{ github.job }}" \
            && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" logs:ci-logs-${{ github.job }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

  # ---------------------------------------------------------------- iOS
  ios:
    name: iOS (Build ohne Signatur)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: set -o pipefail; flutter create . --platforms=android,ios,web --org de.frauas --project-name girokonto_app 2>&1 | tee -a /tmp/ci.log
        shell: bash
      - run: set -o pipefail; flutter pub get 2>&1 | tee -a /tmp/ci.log
        shell: bash
      - run: set -o pipefail; dart run tool/setup_platforms.dart 2>&1 | tee -a /tmp/ci.log
        shell: bash
      - run: set -o pipefail; flutter build ios --simulator --debug 2>&1 | tee -a /tmp/ci.log
        shell: bash
      # Bei Fehlern das Ende des Protokolls als Annotation anzeigen (auch ohne Log-Download lesbar)
      - name: Fehlerprotokoll
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/ci.log ]; then
            # nur relevante Zeilen, in Stücken zu ca. 3.500 Zeichen (Grenze einer Annotation)
            grep -v "(created)" /tmp/ci.log | grep -iE "error|warning|fail|exception|expected|actual|•|\.dart:[0-9]+|what went wrong|caused by|requires|dependency|> " \
              | tail -c 30000 > /tmp/ci-short.log || true
            split -C 3500 /tmp/ci-short.log /tmp/ci-part-
            for f in /tmp/ci-part-*; do
              msg=$(sed -e 's/%/%25/g' -e 's/\r//g' "$f" | awk '{printf "%s%%0A", $0}')
              echo "::error title=Protokoll::$msg"
            done
          fi

      - name: Vollständiges Protokoll in Branch ablegen
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/logs && cp /tmp/ci.log /tmp/logs/ci.log 2>/dev/null || echo "kein Protokoll" > /tmp/logs/ci.log
          cd /tmp/logs && git init -q && git checkout -q -b logs && git add . \
            && git -c user.name=ci -c user.email=ci@example.org commit -qm "Protokoll ${{ github.run_id }} ${{ github.job }}" \
            && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" logs:ci-logs-${{ github.job }}
  # ---------------------------------------------------------------- Docker (komplette Anwendung)
  docker:
    name: Docker-Image (Backend + Web-App)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t girokonto .
