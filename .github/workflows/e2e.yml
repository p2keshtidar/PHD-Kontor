# Ende-zu-Ende-Test: echtes Backend + echte App im Browser, Android-Emulator und iOS-Simulator.
# Läuft manuell (Actions -> E2E -> "Run workflow"), weil der Mac-Runner viele Freiminuten kostet.
name: E2E

on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  DB_URL: jdbc:postgresql://localhost:5432/girokonto
  DB_USER: girokonto
  DB_PASSWORD: girokonto

jobs:
  # ---------------------------------------------------------------- Browser (Chrome)
  web:
    name: E2E Browser (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: girokonto
          POSTGRES_USER: girokonto
          POSTGRES_PASSWORD: girokonto
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U girokonto" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - name: Backend starten
        shell: bash
        run: |
          cd backend && chmod +x gradlew && ./gradlew bootJar --no-daemon -q
          nohup java -jar build/libs/girokonto-backend-0.1.0.jar > /tmp/backend.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:8080/v3/api-docs > /dev/null && break; sleep 2; done
          curl -sf http://localhost:8080/v3/api-docs > /dev/null
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: App vorbereiten
        working-directory: app
        run: |
          flutter create . --platforms=android,ios,web --org de.frauas --project-name girokonto_app > /dev/null
          flutter pub get
          dart run tool/setup_platforms.dart
      - name: Test im Browser
        working-directory: app
        shell: bash
        run: |
          "${CHROMEWEBDRIVER:-/usr/local/bin}/chromedriver" --port=4444 > /tmp/chromedriver.log 2>&1 &
          sleep 2
          set -o pipefail
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart \
            -d web-server --browser-name=chrome --headless 2>&1 | tee -a /tmp/ci.log
      - name: Fehlerprotokoll
        if: failure()
        shell: bash
        run: |
          cat /tmp/backend.log >> /tmp/ci.log 2>/dev/null || true
          { echo '----- Emulator -----'; tail -c 6000 /tmp/emulator.log; } >> /tmp/ci.log 2>/dev/null || true
          { grep -iE "error|exception|fail|expected|actual|nicht gefunden|\.dart:[0-9]+" /tmp/ci.log | tail -c 18000; echo "----- Ende des Protokolls -----"; tail -c 12000 /tmp/ci.log; } > /tmp/s.log 2>/dev/null || true
          split -b 3500 /tmp/s.log /tmp/p-
          for f in /tmp/p-*; do echo "::error title=Protokoll::$(sed -e 's/%/%25/g' -e 's/\r//g' "$f" | awk '{printf "%s%%0A", $0}')"; done

  # ---------------------------------------------------------------- Android-Emulator
  android:
    name: E2E Android-Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: girokonto
          POSTGRES_USER: girokonto
          POSTGRES_PASSWORD: girokonto
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U girokonto" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: KVM für den Emulator freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - name: Backend starten
        shell: bash
        run: |
          cd backend && chmod +x gradlew && ./gradlew bootJar --no-daemon -q
          nohup java -jar build/libs/girokonto-backend-0.1.0.jar > /tmp/backend.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:8080/v3/api-docs > /dev/null && break; sleep 2; done
          curl -sf http://localhost:8080/v3/api-docs > /dev/null
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: App vorbereiten
        working-directory: app
        run: |
          flutter create . --platforms=android,ios,web --org de.frauas --project-name girokonto_app > /dev/null
          flutter pub get
          dart run tool/setup_platforms.dart
      - name: Emulator starten
        shell: bash
        run: |
          S=$ANDROID_HOME; export PATH="$S/platform-tools:$S/emulator:$PATH"
          IMG="system-images;android-30;google_apis;x86_64"
          { yes | $S/cmdline-tools/latest/bin/sdkmanager "emulator" "platform-tools" "$IMG" > /dev/null; } 2>&1 | tail -3 | tee -a /tmp/ci.log
          echo no | $S/cmdline-tools/latest/bin/avdmanager create avd -n e2e -k "$IMG" -d pixel_5 --force 2>&1 | tail -2 | tee -a /tmp/ci.log
          emulator -accel-check 2>&1 | tee -a /tmp/ci.log
          nohup emulator -avd e2e -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 3072 > /tmp/emulator.log 2>&1 &
          timeout 600 adb wait-for-device
          for i in $(seq 1 150); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break; sleep 4
          done
          echo "boot_completed=$(adb shell getprop sys.boot_completed | tr -d '\r')" | tee -a /tmp/ci.log
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Test im Emulator
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          timeout 1500 flutter test integration_test/app_test.dart -d emulator-5554 \
            --dart-define=API_URL=http://10.0.2.2:8080 2>&1 | tee -a /tmp/ci.log
      - name: Fehlerprotokoll
        if: failure()
        shell: bash
        run: |
          cat /tmp/backend.log >> /tmp/ci.log 2>/dev/null || true
          { echo '----- Emulator -----'; tail -c 6000 /tmp/emulator.log; } >> /tmp/ci.log 2>/dev/null || true
          { grep -iE "error|exception|fail|expected|actual|nicht gefunden|\.dart:[0-9]+" /tmp/ci.log | tail -c 18000; echo "----- Ende des Protokolls -----"; tail -c 12000 /tmp/ci.log; } > /tmp/s.log 2>/dev/null || true
          split -b 3500 /tmp/s.log /tmp/p-
          for f in /tmp/p-*; do echo "::error title=Protokoll::$(sed -e 's/%/%25/g' -e 's/\r//g' "$f" | awk '{printf "%s%%0A", $0}')"; done

  # ---------------------------------------------------------------- iOS-Simulator
  ios:
    name: E2E iOS-Simulator
    # macos-15 mit Xcode 16: mit Xcode 26 findet "flutter test" den Dart-VM-Dienst im Simulator nicht
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Xcode 16 wählen
        run: |
          X=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          echo "Verwende $X"
          sudo xcode-select -s "$X"
      - name: PostgreSQL starten
        run: |
          brew install postgresql@16 > /dev/null
          brew services start postgresql@16
          export PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          for i in $(seq 1 30); do pg_isready && break; sleep 2; done
          psql postgres -c "CREATE ROLE girokonto LOGIN PASSWORD 'girokonto';"
          psql postgres -c "CREATE DATABASE girokonto OWNER girokonto;"
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - name: Backend starten
        shell: bash
        run: |
          cd backend && chmod +x gradlew && ./gradlew bootJar --no-daemon -q
          nohup java -jar build/libs/girokonto-backend-0.1.0.jar > /tmp/backend.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:8080/v3/api-docs > /dev/null && break; sleep 2; done
          curl -sf http://localhost:8080/v3/api-docs > /dev/null
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: App vorbereiten
        working-directory: app
        run: |
          flutter create . --platforms=android,ios,web --org de.frauas --project-name girokonto_app > /dev/null
          flutter pub get
          dart run tool/setup_platforms.dart
      - name: Simulator starten
        shell: bash
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone')]
          print(c[-1]['udid'])")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Test im Simulator
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          # Systemprotokoll des Simulators mitschreiben (zeigt Abstürze beim App-Start)
          xcrun simctl spawn "$UDID" log stream --level error --style compact --predicate 'process == "Runner"' > /tmp/sim.log 2>&1 &
          perl -e 'alarm shift; exec @ARGV' 1200 flutter test integration_test/app_test.dart -d "$UDID" -v 2>&1 \
            | grep -vE "^\[ +\+?[0-9]+ ms\] (executing|Exit code|<- |-> )" | tee -a /tmp/ci.log
      - name: Fehlerprotokoll
        if: failure()
        shell: bash
        run: |
          cat /tmp/backend.log >> /tmp/ci.log 2>/dev/null || true
          { echo '----- Simulator -----'; tail -c 8000 /tmp/sim.log; } >> /tmp/ci.log 2>/dev/null || true
          { echo '----- Emulator -----'; tail -c 6000 /tmp/emulator.log; } >> /tmp/ci.log 2>/dev/null || true
          { grep -iE "error|exception|fail|expected|actual|nicht gefunden|\.dart:[0-9]+" /tmp/ci.log | tail -c 18000; echo "----- Ende des Protokolls -----"; tail -c 12000 /tmp/ci.log; } > /tmp/s.log 2>/dev/null || true
          split -b 3500 /tmp/s.log /tmp/p-
          for f in /tmp/p-*; do echo "::error title=Protokoll::$(sed -e 's/%/%25/g' -e 's/\r//g' "$f" | awk '{printf "%s%%0A", $0}')"; done
