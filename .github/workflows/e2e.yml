# Ende-zu-Ende-Test: echtes Backend + echte App im Browser, Android-Emulator und iOS-Simulator.
# Läuft manuell (Actions -> E2E -> "Run workflow"), weil der Mac-Runner viele Freiminuten kostet.
# Mit "versionen: alle" läuft derselbe Test auf Android 7, 8, 9, 11, 13, 15, 16 und iOS 16, 17, 18, 26.
name: E2E

on:
  workflow_dispatch:
    inputs:
      plattform:
        description: Welche Plattform testen?
        type: choice
        options: [alle, browser, android, ios]
        default: alle
      android_geraet:
        description: Android-Gerät (pixel_5 = normal, "Nexus One" = sehr klein, 320 dp)
        type: choice
        options: [pixel_5, Nexus One]
        default: pixel_5
      versionen:
        description: Systemversionen (schnell = je eine, alle = Android 7 bis 16 und iOS 16 bis 26)
        type: choice
        options: [schnell, alle]
        default: schnell

permissions:
  contents: write   # Bildschirmfotos in den Branch ci-shots-* legen

env:
  DB_URL: jdbc:postgresql://localhost:5432/girokonto
  DB_USER: girokonto
  DB_PASSWORD: girokonto

jobs:
  # ---------------------------------------------------------------- Browser (Chrome)
  web:
    name: E2E Browser (Chrome)
    if: inputs.plattform == 'alle' || inputs.plattform == 'browser'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: girokonto
          POSTGRES_USER: girokonto
          POSTGRES_PASSWORD: girokonto
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U girokonto" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - name: Backend starten
        shell: bash
        run: |
          cd backend && chmod +x gradlew && ./gradlew bootJar --no-daemon -q
          nohup java -jar build/libs/girokonto-backend-0.1.0.jar --logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG > /tmp/backend.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:8080/v3/api-docs > /dev/null && break; sleep 2; done
          curl -sf http://localhost:8080/v3/api-docs > /dev/null
          # Aufwärmen: erste Registrierung/Anmeldung ist sonst auf langsamen Runnern sehr langsam
          curl -s -o /dev/null -H 'Content-Type: application/json' http://localhost:8080/api/auth/register \
            -d '{"firstName":"Warm","lastName":"Up","email":"warmup@example.org","phone":"01700000000","birthDate":"1990-01-01","password":"geheim12345"}' || true
          curl -s -o /dev/null -H 'Content-Type: application/json' http://localhost:8080/api/auth/login \
            -d '{"email":"warmup@example.org","password":"geheim12345"}' || true
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: App vorbereiten
        working-directory: app
        run: |
          flutter create . --platforms=android,ios,web --org de.frauas --project-name girokonto_app > /dev/null
          flutter pub get
          dart run tool/setup_platforms.dart
      - name: Test im Browser
        working-directory: app
        shell: bash
        run: |
          "${CHROMEWEBDRIVER:-/usr/local/bin}/chromedriver" --port=4444 > /tmp/chromedriver.log 2>&1 &
          sleep 2
          set -o pipefail
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart \
            -d web-server --browser-name=chrome --headless 2>&1 | tee -a /tmp/ci.log
      - name: Fehlerprotokoll
        if: failure()
        shell: bash
        run: |
          cat /tmp/backend.log >> /tmp/ci.log 2>/dev/null || true
          { echo '----- Emulator -----'; tail -c 6000 /tmp/emulator.log; } >> /tmp/ci.log 2>/dev/null || true
          { echo '----- Anfragen (letzte 40) -----'; grep -E "Completed [0-9]{3}|^.*DispatcherServlet.*(POST|PUT|DELETE)" /tmp/backend.log | sed -E 's/^.*DispatcherServlet *: //' | tail -40; } >> /tmp/req.log 2>/dev/null || true
          { cat /tmp/req.log 2>/dev/null; echo '----- Wichtigste Fehler -----'; grep -iE -A4 "SICHTBAR:|overflowed by|error-causing widget|Expected:|Actual:|Which:|Exception:|Bad state" /tmp/ci.log | grep -v "package:flutter/" | head -c 9000;
            grep -iE "error|exception|fail|expected|actual|nicht gefunden|\.dart:[0-9]+" /tmp/ci.log | grep -v "package:flutter/" | tail -c 9000; echo "----- Ende des Protokolls -----"; tail -c 12000 /tmp/ci.log; } > /tmp/s.log 2>/dev/null || true
          split -b 3500 /tmp/s.log /tmp/p-
          for f in /tmp/p-*; do echo "::error title=Protokoll::$(sed -e 's/%/%25/g' -e 's/\r//g' "$f" | awk '{printf "%s%%0A", $0}')"; done

  # ---------------------------------------------------------------- Android-Emulator
  android:
    name: E2E Android ${{ matrix.api }}
    if: inputs.plattform == 'alle' || inputs.plattform == 'android'
    strategy:
      fail-fast: false
      matrix:
        # API 24 = Android 7.0 (älteste von Flutter unterstützte Version) … 36 = Android 16
        api: ${{ fromJSON(inputs.versionen == 'alle' && '[24, 26, 28, 30, 33, 35, 36]' || '[30]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: girokonto
          POSTGRES_USER: girokonto
          POSTGRES_PASSWORD: girokonto
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U girokonto" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: KVM für den Emulator freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - name: Backend starten
        shell: bash
        run: |
          cd backend && chmod +x gradlew && ./gradlew bootJar --no-daemon -q
          nohup java -jar build/libs/girokonto-backend-0.1.0.jar --logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG > /tmp/backend.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:8080/v3/api-docs > /dev/null && break; sleep 2; done
          curl -sf http://localhost:8080/v3/api-docs > /dev/null
          # Aufwärmen: erste Registrierung/Anmeldung ist sonst auf langsamen Runnern sehr langsam
          curl -s -o /dev/null -H 'Content-Type: application/json' http://localhost:8080/api/auth/register \
            -d '{"firstName":"Warm","lastName":"Up","email":"warmup@example.org","phone":"01700000000","birthDate":"1990-01-01","password":"geheim12345"}' || true
          curl -s -o /dev/null -H 'Content-Type: application/json' http://localhost:8080/api/auth/login \
            -d '{"email":"warmup@example.org","password":"geheim12345"}' || true
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: App vorbereiten
        working-directory: app
        run: |
          flutter create . --platforms=android,ios,web --org de.frauas --project-name girokonto_app > /dev/null
          flutter pub get
          dart run tool/setup_platforms.dart
      - name: Emulator starten
        shell: bash
        run: |
          set +o pipefail   # "yes | sdkmanager" endet absichtlich mit SIGPIPE
          S=$ANDROID_HOME; export PATH="$S/platform-tools:$S/emulator:$PATH"
          IMG="system-images;android-${{ matrix.api }};google_apis;x86_64"
          # Download mit Wiederholung (bricht bei GitHub manchmal ab)
          for try in 1 2 3; do
            { yes | $S/cmdline-tools/latest/bin/sdkmanager "emulator" "platform-tools" "$IMG" > /dev/null; } 2>&1 | tail -3 | tee -a /tmp/ci.log
            [ -f "$S/system-images/android-${{ matrix.api }}/google_apis/x86_64/system.img" ] && break
            echo "Systemabbild unvollständig, Versuch $try" | tee -a /tmp/ci.log
            rm -rf "$S/system-images/android-${{ matrix.api }}/google_apis/x86_64"; sleep 10
          done
          export ANDROID_AVD_HOME="$HOME/.android/avd"; mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo no | $S/cmdline-tools/latest/bin/avdmanager create avd -n e2e -k "$IMG" -d "${{ inputs.android_geraet || 'pixel_5' }}" --force 2>&1 | tee -a /tmp/ci.log
          echo "AVDs: $(emulator -list-avds | tr '\n' ' ')" | tee -a /tmp/ci.log
          emulator -accel-check 2>&1 | tee -a /tmp/ci.log || true
          ls "$S/system-images/android-${{ matrix.api }}/google_apis/x86_64/system.img"
          nohup emulator -avd e2e -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 3072 > /tmp/emulator.log 2>&1 &
          timeout 600 adb wait-for-device
          for i in $(seq 1 150); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break; sleep 4
          done
          echo "boot_completed=$(adb shell getprop sys.boot_completed | tr -d '\r'), Android $(adb shell getprop ro.build.version.release | tr -d '\r') (API $(adb shell getprop ro.build.version.sdk | tr -d '\r'))" | tee -a /tmp/ci.log
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Test im Emulator
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          timeout 1500 flutter test integration_test/app_test.dart -d emulator-5554 \
            --dart-define=API_URL=http://10.0.2.2:8080 2>&1 | tee -a /tmp/full.log | grep -v 'SCREENSHOT:' | tee -a /tmp/ci.log
      - name: Bildschirmfotos ablegen
        if: always()
        shell: bash
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: bash .github/scripts/bildschirmfotos.sh "android-${{ matrix.api }}" /tmp/full.log || true
      - name: Fehlerprotokoll
        if: failure()
        shell: bash
        run: |
          cat /tmp/backend.log >> /tmp/ci.log 2>/dev/null || true
          { echo '----- Emulator -----'; tail -c 6000 /tmp/emulator.log; } >> /tmp/ci.log 2>/dev/null || true
          { echo '----- Anfragen (letzte 40) -----'; grep -E "Completed [0-9]{3}|^.*DispatcherServlet.*(POST|PUT|DELETE)" /tmp/backend.log | sed -E 's/^.*DispatcherServlet *: //' | tail -40; } >> /tmp/req.log 2>/dev/null || true
          { cat /tmp/req.log 2>/dev/null; echo '----- Wichtigste Fehler -----'; grep -iE -A4 "SICHTBAR:|overflowed by|error-causing widget|Expected:|Actual:|Which:|Exception:|Bad state" /tmp/ci.log | grep -v "package:flutter/" | head -c 9000;
            grep -iE "error|exception|fail|expected|actual|nicht gefunden|\.dart:[0-9]+" /tmp/ci.log | grep -v "package:flutter/" | tail -c 9000; echo "----- Ende des Protokolls -----"; tail -c 12000 /tmp/ci.log; } > /tmp/s.log 2>/dev/null || true
          split -b 3500 /tmp/s.log /tmp/p-
          for f in /tmp/p-*; do echo "::error title=Protokoll::$(sed -e 's/%/%25/g' -e 's/\r//g' "$f" | awk '{printf "%s%%0A", $0}')"; done

  # ---------------------------------------------------------------- iOS-Simulator
  ios:
    name: E2E iOS ${{ matrix.ios }}
    if: inputs.plattform == 'alle' || inputs.plattform == 'ios'
    strategy:
      fail-fast: false
      matrix:
        # Gebaut wird immer mit Xcode 26 (workmanager braucht das iOS-26-SDK),
        # getestet auf dem Simulator der jeweiligen iOS-Version.
        include: ${{ fromJSON(inputs.versionen == 'alle' && '[{"ios":"26","runner":"macos-latest","xcode":"","runtime":"iOS-26"},{"ios":"18","runner":"macos-15","xcode":"/Applications/Xcode_26.3.app","runtime":"iOS-18"},{"ios":"17","runner":"macos-latest","xcode":"","runtime":"iOS-17","download":"17.5"},{"ios":"16","runner":"macos-latest","xcode":"","runtime":"iOS-16","download":"16.4"}]' || '[{"ios":"26","runner":"macos-latest","xcode":"","runtime":"iOS-26"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: PostgreSQL starten
        run: |
          brew install postgresql@16 > /dev/null
          brew services start postgresql@16
          export PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          for i in $(seq 1 30); do pg_isready && break; sleep 2; done
          psql postgres -c "CREATE ROLE girokonto LOGIN PASSWORD 'girokonto';"
          psql postgres -c "CREATE DATABASE girokonto OWNER girokonto;"
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - name: Backend starten
        shell: bash
        run: |
          cd backend && chmod +x gradlew && ./gradlew bootJar --no-daemon -q
          nohup java -jar build/libs/girokonto-backend-0.1.0.jar --logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG > /tmp/backend.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:8080/v3/api-docs > /dev/null && break; sleep 2; done
          curl -sf http://localhost:8080/v3/api-docs > /dev/null
          # Aufwärmen: erste Registrierung/Anmeldung ist sonst auf langsamen Runnern sehr langsam
          curl -s -o /dev/null -H 'Content-Type: application/json' http://localhost:8080/api/auth/register \
            -d '{"firstName":"Warm","lastName":"Up","email":"warmup@example.org","phone":"01700000000","birthDate":"1990-01-01","password":"geheim12345"}' || true
          curl -s -o /dev/null -H 'Content-Type: application/json' http://localhost:8080/api/auth/login \
            -d '{"email":"warmup@example.org","password":"geheim12345"}' || true
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: App vorbereiten
        working-directory: app
        run: |
          flutter create . --platforms=android,ios,web --org de.frauas --project-name girokonto_app > /dev/null
          flutter pub get
          dart run tool/setup_platforms.dart
          # CocoaPods lädt aus dem Internet und bricht manchmal ab: bis zu 3 Versuche
          for i in 1 2 3; do flutter build ios --config-only --simulator > /tmp/pods.log 2>&1 && break; tail -20 /tmp/pods.log; sleep 20; done
      - name: Simulator starten
        shell: bash
        run: |
          exec > >(tee -a /tmp/ci.log) 2>&1   # alles ins Protokoll (für die Fehlersuche)
          set -x
          if [ -n "${{ matrix.xcode }}" ]; then sudo xcode-select -s "${{ matrix.xcode }}"; fi
          xcodebuild -version
          # ältere iOS-Versionen: Simulator bei Apple laden (ca. 2 Minuten)
          if [ -n "${{ matrix.download }}" ]; then
            for i in 1 2 3; do
              xcodebuild -downloadPlatform iOS -buildVersion "${{ matrix.download }}" 2>&1 | tr '\r' '\n' | grep -v '%' | tail -3
              xcrun simctl list runtimes | grep -q "iOS ${{ matrix.download }}" && break
              sleep 30
            done
            xcrun simctl list runtimes
          fi
          # Für frisch geladene iOS-Versionen gibt es noch kein Gerät: iPhone anlegen
          RT=$(xcrun simctl list runtimes -j | python3 -c "
          import json,sys
          r=[x['identifier'] for x in json.load(sys.stdin)['runtimes'] if '${{ matrix.runtime }}' in x['identifier'] and x['isAvailable']]
          print(r[-1] if r else '')")
          echo "Runtime: $RT" | tee -a /tmp/ci.log
          N=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          print(sum(1 for r,l in json.load(sys.stdin)['devices'].items() if '${{ matrix.runtime }}' in r for x in l if x['name'].startswith('iPhone')))")
          if [ "$N" = "0" ]; then
            xcrun simctl create "iPhone E2E" "iPhone 14" "$RT" | tee -a /tmp/ci.log
          fi
          # neuestes iPhone mit der gewünschten iOS-Version
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[(r,x) for r,l in sorted(d.items()) if '${{ matrix.runtime }}' in r for x in l if x['name'].startswith('iPhone')]
          print(c[-1][1]['udid']); print(c[-1][0], c[-1][1]['name'], file=sys.stderr)")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Test im Simulator
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          # Systemprotokoll des Simulators mitschreiben (zeigt Abstürze beim App-Start)
          xcrun simctl spawn "$UDID" log stream --level error --style compact --predicate 'process == "Runner"' > /tmp/sim.log 2>&1 &
          perl -e 'alarm shift; exec @ARGV' 1200 flutter test integration_test/app_test.dart -d "$UDID" -v 2>&1 \
            | grep -vE "^\[ +\+?[0-9]+ ms\] (executing|Exit code|<- |-> )" | tee -a /tmp/full.log | grep -v 'SCREENSHOT:' | tee -a /tmp/ci.log
      - name: Bildschirmfotos ablegen
        if: always()
        shell: bash
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: bash .github/scripts/bildschirmfotos.sh "ios-${{ matrix.ios }}" /tmp/full.log || true
      - name: Fehlerprotokoll
        if: failure()
        shell: bash
        run: |
          cat /tmp/backend.log >> /tmp/ci.log 2>/dev/null || true
          { echo '----- Simulator -----'; tail -c 8000 /tmp/sim.log; } >> /tmp/ci.log 2>/dev/null || true
          { echo '----- Emulator -----'; tail -c 6000 /tmp/emulator.log; } >> /tmp/ci.log 2>/dev/null || true
          { echo '----- Anfragen (letzte 40) -----'; grep -E "Completed [0-9]{3}|^.*DispatcherServlet.*(POST|PUT|DELETE)" /tmp/backend.log | sed -E 's/^.*DispatcherServlet *: //' | tail -40; } >> /tmp/req.log 2>/dev/null || true
          { cat /tmp/req.log 2>/dev/null; echo '----- Wichtigste Fehler -----'; grep -iE -A4 "SICHTBAR:|overflowed by|error-causing widget|Expected:|Actual:|Which:|Exception:|Bad state" /tmp/ci.log | grep -v "package:flutter/" | head -c 9000;
            grep -iE "error|exception|fail|expected|actual|nicht gefunden|\.dart:[0-9]+" /tmp/ci.log | grep -v "package:flutter/" | tail -c 9000; echo "----- Ende des Protokolls -----"; tail -c 12000 /tmp/ci.log; } > /tmp/s.log 2>/dev/null || true
          split -b 3500 /tmp/s.log /tmp/p-
          for f in /tmp/p-*; do echo "::error title=Protokoll::$(sed -e 's/%/%25/g' -e 's/\r//g' "$f" | awk '{printf "%s%%0A", $0}')"; done
