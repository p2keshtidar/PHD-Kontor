# Baut bei jedem Push fertige Apps und legt sie unter "Releases -> latest" zum Herunterladen ab:
#   girokonto.apk            Android (auf dem Handy installieren)
#   girokonto-server.jar     Backend + Web-App (java -jar girokonto-server.jar, braucht PostgreSQL)
#   girokonto-web.zip        nur die Web-App
#   girokonto-ios-unsigned.ipa  iOS ohne Signatur (z. B. mit Sideloadly/AltStore + eigener Apple-ID installieren)
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  server:
    name: Web-App + Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - name: Web-App bauen
        working-directory: app
        run: |
          flutter create . --platforms=web --org de.frauas --project-name girokonto_app > /dev/null
          flutter pub get
          dart run tool/setup_platforms.dart
          flutter build web --release --no-web-resources-cdn
          cd build/web && zip -qr ../../../girokonto-web.zip .
      - name: Server mit Web-App bauen
        run: |
          mkdir -p backend/src/main/resources/static
          cp -r app/build/web/. backend/src/main/resources/static/
          cd backend && chmod +x gradlew && ./gradlew bootJar --no-daemon -q
          cp build/libs/girokonto-backend-0.1.0.jar ../girokonto-server.jar
      - uses: actions/upload-artifact@v4
        with: { name: server, path: "girokonto-*" }

  android:
    name: Android-APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - working-directory: app
        run: |
          flutter create . --platforms=android --org de.frauas --project-name girokonto_app > /dev/null
          flutter pub get
          dart run tool/setup_platforms.dart
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../girokonto.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: girokonto.apk }

  ios:
    name: iOS (ohne Signatur)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - working-directory: app
        run: |
          flutter create . --platforms=ios --org de.frauas --project-name girokonto_app > /dev/null
          flutter pub get
          dart run tool/setup_platforms.dart
          flutter build ios --release --no-codesign
          mkdir Payload && cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr ../girokonto-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: girokonto-ios-unsigned.ipa }

  publish:
    name: Veröffentlichen
    needs: [server, android, ios]
    if: always() && needs.server.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* --title "Aktuelle Version" --latest \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. Anleitung: siehe README, Abschnitt 'Fertige Apps herunterladen'."
